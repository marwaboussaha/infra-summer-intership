name: VoiceCraft Infrastructure

# Developer -> VS Code -> push -> GitHub Repo -> GitHub Actions
#   1. Security checks : Gitleaks, Checkov, tfsec -> Email security scan results
#   2. Terraform       : setup, fmt check, init, validate, plan -> Email plan output
#   3. Apply           : NEVER automatic. Triggered manually from the Actions tab
#                        (Run workflow + "apply" checked), then approved in "production"
#
# IMPORTANT - role OIDC :
#   La politique de confiance du role AWS_DEPLOY_ROLE_ARN doit accepter TOUS
#   les "sub" emis par ce workflow (push, pull_request, environment:production) :
#     StringEquals token.actions.githubusercontent.com:aud = sts.amazonaws.com
#     StringLike   token.actions.githubusercontent.com:sub = repo:<owner>/<repo>:*
#   Comme ce role est gere par Terraform, toute correction de sa politique de
#   confiance doit d'abord etre appliquee A LA MAIN (console IAM / CLI), sinon
#   le pipeline ne peut pas assumer le role pour appliquer la correction.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the Terraform plan (manual deployment)"
        type: boolean
        default: false
      image_tag:
        description: "ECR image tag (empty = IMAGE_TAG variable)"
        required: false
      debug_oidc:
        description: "Afficher les claims OIDC (sub, aud) pour diagnostiquer AssumeRole"
        type: boolean
        default: false
  repository_dispatch:
    types: [deploy]

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: infra-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "eu-west-3"
  TF_IN_AUTOMATION: "true"

  # Terraform variables (Settings > Secrets and variables > Actions > Variables)
  #
  # Rappel de precedence Terraform : terraform.tfvars l'emporte sur les
  # variables d'environnement TF_VAR_*. Si terraform.tfvars est commite avec
  # le domaine, les variables GitHub ci-dessous ne sont qu'un filet de
  # securite. Pour piloter depuis GitHub, supprimer terraform.tfvars.
  TF_VAR_image_tag: ${{ github.event.inputs.image_tag || github.event.client_payload.image_tag || vars.IMAGE_TAG || 'bootstrap' }}
  TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_create_hosted_zone: ${{ vars.CREATE_HOSTED_ZONE || 'true' }}
  TF_VAR_additional_domain_names: ${{ vars.ADDITIONAL_DOMAIN_NAMES || '[]' }}
  TF_VAR_enable_http_redirect: ${{ vars.ENABLE_HTTP_REDIRECT || 'false' }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_github_repositories: ${{ vars.DEPLOY_REPOSITORIES || format('["{0}"]', github.repository) }}
  TF_VAR_github_terraform_policy_arns: ${{ vars.TERRAFORM_POLICY_ARNS || '[]' }}

jobs:

  # --- 1. Security checks ----------------------------------------------------
  security:
    name: Security checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks - secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov - security checks (SARIF)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: sarif
          output_file_path: checkov-sarif-output
          soft_fail: true
        continue-on-error: true

      - name: Checkov - locate SARIF report
        run: |
          if [ -f checkov-sarif-output/results_sarif.sarif ]; then
            cp checkov-sarif-output/results_sarif.sarif checkov-results.sarif
          else
            echo "Checkov SARIF not found, creating empty file"
            echo '{}' > checkov-results.sarif
          fi
          ls -la checkov-results.sarif

      - name: Checkov - text summary
        run: |
          pip install checkov --quiet
          checkov -d . --config-file .checkov.yaml --compact > /dev/null 2>&1 || true
          if [ -f checkov-results/results_cli.txt ]; then
            cp checkov-results/results_cli.txt checkov-summary.txt
          else
            echo "No Checkov result" > checkov-summary.txt
          fi

      - name: tfsec - install
        run: |
          curl -sLo tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/

      - name: tfsec - security checks (SARIF)
        run: tfsec . --format sarif --out tfsec-results.sarif --no-color || true

      - name: tfsec - text summary
        run: tfsec . --no-color > tfsec-summary.txt 2>&1 || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            checkov-results.sarif
            tfsec-results.sarif
            checkov-summary.txt
            tfsec-summary.txt
          if-no-files-found: ignore

      - name: Email security scan results
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Security Scan - ${{ github.repository }} (commit ${{ github.sha }})"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Security scan completed for commit ${{ github.sha }} on ${{ github.ref_name }}.

            Gitleaks, Checkov and tfsec have been executed.
            Checkov and tfsec results are attached as both human-readable summaries
            (.txt) and SARIF files (.sarif) for tool integration.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: checkov-summary.txt,tfsec-summary.txt,checkov-results.sarif,tfsec-results.sarif


  # --- 2. Terraform validate and plan ----------------------------------------
  validate-and-plan:
    name: Terraform validate and plan
    runs-on: ubuntu-latest
    needs: [security]

    permissions:
      contents: read
      id-token: write # AWS login with OIDC, no stored key

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      AWS_READY: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      # Diagnostic : affiche les claims du jeton OIDC (jamais le jeton lui-meme).
      # Se lance automatiquement en cas de re-run en mode debug, ou via l'input
      # "debug_oidc" de Run workflow. A comparer avec la politique de confiance.
      - name: Debug OIDC claims
        if: env.AWS_READY == 'true' && (inputs.debug_oidc || runner.debug == '1')
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          # re-padding base64
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, ref, environment}'
          echo "Role cible : ${{ vars.AWS_DEPLOY_ROLE_ARN }}"

      # Next steps run only when the AWS account is ready (AWS_DEPLOY_ROLE_ARN set)
      - name: Configure AWS credentials (OIDC)
        if: env.AWS_READY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform init (S3 backend)
        if: env.AWS_READY == 'true'
        run: terraform init -input=false -reconfigure

      - name: Terraform plan
        id: plan
        if: env.AWS_READY == 'true'
        run: |
          set +e
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan \
            -detailed-exitcode \
            -no-color \
            2>&1 | tee plan-output.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          echo "exitcode=$PLAN_EXIT" >> $GITHUB_OUTPUT

          if [ $PLAN_EXIT -eq 1 ]; then
            echo "::error::Terraform plan encountered an error"
            exit 1
          fi
          exit 0

      - name: Plan summary
        if: env.AWS_READY == 'true' && always()
        run: |
          {
            echo "### Terraform plan"
            echo "Exit code: ${{ steps.plan.outputs.exitcode }} (0 = no changes, 2 = changes detected)"
            echo '```'
            tail -n 60 plan-output.txt 2>/dev/null || echo "No output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save plan artifact
        uses: actions/upload-artifact@v4
        if: env.AWS_READY == 'true' && always()
        with:
          name: tfplan
          path: |
            tfplan
            plan-output.txt
          retention-days: 5
          if-no-files-found: ignore

      - name: Email plan output
        if: env.AWS_READY == 'true' && steps.plan.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Terraform Plan - ${{ github.repository }} (${{ steps.plan.outputs.exitcode == '2' && 'Changes detected - approval required' || 'No changes' }})"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Terraform plan completed for commit ${{ github.sha }}.
            Exit code: ${{ steps.plan.outputs.exitcode }} (0 = no changes, 2 = changes detected)

            1. Review the attached plan-output.txt (check the "to destroy" count).
            2. To deploy, trigger the apply MANUALLY:
               ${{ github.server_url }}/${{ github.repository }}/actions/workflows/infra.yml
               -> "Run workflow" -> branch main -> check "apply" -> "Run workflow".
            3. When the new run reaches the "Terraform apply" job,
               click "Review deployments" -> "production" -> "Approve and deploy".

            Nothing is deployed until these steps are done.

            Plan run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: plan-output.txt


  # --- 3. Terraform apply (manual trigger + approval) ------------------------
  apply:
    name: Terraform apply (manual trigger + approval)
    runs-on: ubuntu-latest
    needs: [validate-and-plan]
    # Never on push: only "Run workflow" with "apply" checked, on main,
    # and only when the plan of this run detected changes
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main' && needs.validate-and-plan.outputs.plan_exitcode == '2'
    # Avec un environment, le "sub" OIDC devient :
    #   repo:<owner>/<repo>:environment:production
    # -> la politique de confiance doit l'accepter (StringLike repo:<owner>/<repo>:*)
    environment: production # required reviewers = manual approval

    # La validation ACM attend la delegation NS chez GoDaddy : jusqu'a 45 min.
    # Sans cette limite, un runner resterait bloque 6 h (defaut GitHub).
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-duration-seconds: 7200

      - name: Terraform init
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: .

      - name: Terraform apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      # always() : au premier apply, la validation ACM echoue tant que les
      # serveurs de noms ne sont pas saisis chez GoDaddy. La zone Route 53 est
      # pourtant deja creee, donc les NS sont lisibles et doivent s'afficher
      # meme quand l'apply a echoue -- c'est tout l'interet de cette etape.
      - name: Nameservers to set at GoDaddy
        if: always()
        continue-on-error: true
        run: |
          NS="$(terraform output -json route53_name_servers 2>/dev/null | jq -r '.[]' || true)"
          if [ -z "${NS}" ]; then
            echo "Zone Route 53 pas encore creee - relancer l'apply."
            exit 0
          fi
          {
            echo "### Nameservers a saisir chez GoDaddy"
            echo ""
            echo "GoDaddy -> My Products -> voicecraft-plateform.website -> DNS"
            echo "-> Nameservers -> Change -> I'll use my own nameservers"
            echo ""
            echo '```'
            echo "${NS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${NS}"

      - name: Output application URL
        run: |
          {
            echo "### Deployment finished"
            echo "- Application: $(terraform output -raw app_url)"
            echo "- ALB: $(terraform output -raw alb_dns_name)"
            echo "- Certificat ACM: $(terraform output -raw acm_certificate_arn)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email apply result
        if: always() && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Terraform Apply - ${{ github.repository }} (${{ job.status }})"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Terraform apply finished with status: ${{ job.status }}
            Commit: ${{ github.sha }}

            Si le statut est "failure" sur aws_acm_certificate_validation :
            c'est attendu au premier apply. La zone Route 53 vient d'etre creee,
            les 4 serveurs de noms sont dans le resume du run. Les saisir chez
            GoDaddy, attendre la propagation, puis relancer l'apply.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}